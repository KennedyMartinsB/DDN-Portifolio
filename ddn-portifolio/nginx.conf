# Example Nginx configuration for deploying this Angular SPA
# Place this inside your server block, adjusting root and server_name as needed.

server {
  listen 80;
  server_name example.com;
  root /var/www/ddn-portifolio/dist/ddn-portifolio;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public";
  }

  error_page 404 /index.html;
}
