<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-full max-w-[94vw] sm:w-max sm:max-w-none">
  <div class="relative">
    <div class="absolute inset-y-0 left-0 w-10 bg-gradient-to-r  to-transparent z-10 pointer-events-none sm:hidden rounded-l-full"></div>
    <div class="absolute inset-y-0 right-0 w-10 bg-gradient-to-l  to-transparent z-10 pointer-events-none sm:hidden rounded-r-full"></div>
    <div class="overflow-x-auto no-scrollbar snap-x snap-mandatory touch-pan-x py-4 px-6">
      <nav class="bg-gray-900/90 backdrop-blur-xl border border-white/10 p-1 rounded-full flex items-center gap-1.5 w-max mx-auto">
        <button
          *ngFor="let category of categories"
          (click)="selectCategory(category, $event)"
          class="px-5 py-2.5 rounded-full text-[12px] sm:text-xs font-bold transition-all duration-300 whitespace-nowrap snap-center outline-none select-none"
          [ngClass]="selectedCategory === category
            ? 'bg-white text-black scale-105'
            : 'text-gray-400 hover:text-white active:bg-white/10 active:scale-95'"
        >
          {{ category }}
        </button>
      </nav>
    </div>
  </div>
</div>
