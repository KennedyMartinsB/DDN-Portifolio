<main class="bg-black pt-24 sm:pt-28 pb-16 px-4 sm:px-6">
  <div
    class="mx-auto w-full max-w-[1920px] columns-1 gap-x-2 sm:columns-2 md:columns-3 lg:columns-4 xl:columns-5">

    <div *ngFor="let item of filteredItems"
         (click)="openModal(item)"
         class="group relative mb-2 cursor-pointer break-inside-avoid">
      <img
        [src]="item.imageUrl"
        [alt]="item.title"
        loading="lazy"
        class="block h-auto w-full grayscale transition-all duration-500 ease-in-out group-hover:grayscale-0"
      >
      <!-- <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center pointer-events-none">
        <div class="bg-white text-black px-4 py-3 rounded-sm shadow-2xl transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300">
          <p class="font-bold text-[11px] leading-tight uppercase tracking-wider">{{ item.title }}</p>
          <p class="text-[9px] text-gray-500 mt-0.5">{{ item.year }}</p>
        </div>
      </div> -->
    </div>

  </div>

  <div *ngIf="errorMessage" class="text-center py-8">
    <p class="text-red-500 text-lg">{{ errorMessage }}</p>
  </div>
</main>

<!-- Detailed Modal View -->
<app-gallery-modal
  *ngIf="selectedItem"
  [item]="selectedItem"
  (close)="closeModal()">
</app-gallery-modal>
