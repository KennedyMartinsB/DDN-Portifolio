<main class="pt-24 sm:pt-32 pb-24 px-4 sm:px-6">
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">

    <div *ngFor="let item of filteredItems" class="relative group overflow-hidden rounded-sm cursor-pointer bg-black">
      <img
        [src]="item.imageUrl"
        [alt]="item.title"
        class="w-full h-[500px] object-cover grayscale group-hover:grayscale-0 transition-all duration-700 ease-in-out transform group-hover:scale-105"
      >

      <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center bg-black/20">
        <div class="bg-white text-black px-4 py-3 rounded-sm shadow-2xl transform translate-y-4 group-hover:translate-y-0 transition-transform duration-500 cubic-bezier">
          <p class="font-bold text-[11px] leading-tight uppercase tracking-tighter">{{ item.title }}</p>
          <p class="text-[9px] text-gray-500 mt-0.5 font-mono italic">{{ item.year }}</p>
        </div>
      </div>
    </div>

  </div>
</main>
