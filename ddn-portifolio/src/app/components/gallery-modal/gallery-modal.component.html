<div *ngIf="item" class="fixed inset-0 z-[100] bg-[#1f2937] flex flex-col items-center justify-center p-4 sm:p-8 animate-in fade-in duration-300">

  <div class="absolute top-6 left-6 sm:top-12 sm:left-12 z-10">
    <h2 class="text-lg sm:text-xl font-medium text-gray-300 uppercase tracking-tight">{{ item.title }}</h2>
    <p class="text-sm sm:text-base text-gray-400 font-light mt-1">{{ item.year }}</p>
  </div>

  <button (click)="onClose()" class="absolute top-6 right-6 sm:top-12 sm:right-12 z-10 p-2 hover:bg-gray-100 rounded-full transition-all">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <div class="relative w-full mt-[80px] max-w-5xl xl:max-w-6xl h-[60vh] sm:h-[75vh] flex items-center justify-center">

    <button *ngIf="item.images && item.images.length > 1"
      (click)="prevImage()"
      class="absolute left-4 xl:-left-24 z-20 p-4 sm:p-6 bg-white shadow-2xl rounded-full hover:bg-gray-50 transition-all transform hover:scale-110 active:scale-95 group">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6 text-black transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <div class="w-full h-full flex items-center justify-center">
      <img
        *ngIf="item.images"
        [src]="item.images[currentIndex]"
        class="max-w-full max-h-full object-contain shadow-2xl animate-in zoom-in-95 fade-in duration-500"
        [alt]="item.title"
      >
    </div>

    <button *ngIf="item.images && item.images.length > 1"
      (click)="nextImage()"
      class="absolute right-4 xl:-right-24 z-20 p-4 sm:p-6 bg-white shadow-2xl rounded-full hover:bg-gray-50 transition-all transform hover:scale-110 active:scale-95 group">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6 text-black transform group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <div class="mt-4 flex flex-col items-center gap-4">
    <div *ngIf="item.images && item.images.length > 1" class="flex gap-3 px-4 py-2 bg-[#6e6e6e] rounded-lg shadow-inner overflow-x-auto no-scrollbar max-w-[90vw]">
      <div
        *ngFor="let img of item.images; let i = index"
        (click)="selectImage(i)"
        class="relative w-16 h-12 sm:w-20 sm:h-14 cursor-pointer flex-shrink-0 overflow-hidden rounded-md transition-all border-2"
        [ngClass]="currentIndex === i ? 'border-black opacity-100 scale-105' : 'border-transparent opacity-40 hover:opacity-70'"
      >
        <img [src]="img" class="w-full h-full object-cover">
      </div>
    </div>
    <p *ngIf="item.images && item.images.length > 1" class="text-xs font-medium text-gray-400 tracking-[0.2em] uppercase">
      {{ currentIndex + 1 }} / {{ item.images.length }}
    </p>
  </div>
</div>
